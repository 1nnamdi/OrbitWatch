services:
  db:
    image: postgres:16
    container_name: orbitwatch-db
    environment:
      POSTGRES_USER: orbitwatch
      POSTGRES_PASSWORD: orbitwatch
      POSTGRES_DB: orbitwatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbitwatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: orbitwatch-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@orbitwatch.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - db

  frontend:
    image: node:22-alpine
    container_name: orbitwatch-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://host.docker.internal:8800
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  pgdata:
  frontend_node_modules:
